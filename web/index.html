<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="百分之一小作文生成工具 — 输入游戏名，AI 自动生成符合 TapTap《我的百分之一》活动格式的推荐帖子" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>百分之一小作文生成工具</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f3e8ff'/%3E%3Crect x='13' y='10' width='38' height='44' rx='3' fill='none' stroke='%236d28d9' stroke-width='5'/%3E%3Cpath d='M22 24h20M22 34h14M22 44h18' stroke='%236d28d9' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <!-- 防主题闪烁：在 HTML 解析前注入 data-theme / data-palette -->
    <script>
      (function() {
        var t = localStorage.getItem('onepercent-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
        var p = localStorage.getItem('onepercent-palette');
        if (['violet', 'blue', 'green', 'rose'].indexOf(p) > -1) {
          document.documentElement.setAttribute('data-palette', p);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
